<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CONTACT</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body>
    <div class="container">
      <header id="menu-container"></header>
      <main class="main-contact-info">
        <div class="contact-info">
          <h1 class="contact-title">Contact Info</h1>
          <div class="block-form-contact-info-map">
            <section class="section-contact-form">
              <form
                action="https://formsubmit.co/gazda.andriy@gmail.com"
                method="post"
                class="form"
              >
                <div class="form-field">
                  <label for="firstname">First name:</label>
                  <input
                    type="text"
                    id="firstname"
                    name="firstname"
                    placeholder="Your first name"
                    class="form-input"
                    required
                  />
                </div>

                <div class="form-field">
                  <label for="lastname">Last name:</label>
                  <input
                    type="text"
                    id="lastname"
                    name="lastname"
                    placeholder="Your last name"
                    class="form-input"
                    required
                  />
                </div>

                <div class="form-field">
                  <label for="email">Email:</label>
                  <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-input"
                    placeholder="example@gmail.com"
                  />
                </div>

                <div class="form-field">
                  <label for="number">Number:</label>
                  <input
                    type="tel"
                    id="number"
                    name="number"
                    class="form-input"
                    placeholder="+380971231234"
                    required
                  />
                </div>

                <div class="form-field">
                  <label for="message">Message:</label>
                  <textarea
                    id="message"
                    name="message"
                    class="form-textarea"
                    placeholder="Your message"
                  ></textarea>
                </div>

                <button type="submit" name="send" class="form-button">
                  Send
                </button>
              </form>
            </section>
            <div class="block-contact-info-map">
              <section class="section-contact-info">
                <p><b>Address:</b> pr. Viacheslav Chornovil, Lviv, Ukraine</p>
                <p><b>Phone:</b> +38 (099) 123-12-34</p>
                <p><b>Email:</b> example@email.com</p>
              </section>
              <section class="section-contact-map" id="map"></section>
            </div>
          </div>
        </div>
      </main>
      <footer id="footer-container"></footer>
    </div>
    <script type="module" src="/src/js/styles.js"></script>
    <script type="module" src="/src/js/menu.js"></script>
    <script type="module" src="/src/js/contact-map.js"></script>
    <script type="module" src="/src/js/footer.js"></script>
  </body>
</html>
